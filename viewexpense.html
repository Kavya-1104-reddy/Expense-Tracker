<!DOCTYPE html>
<html>
<head>
<title>Ultra Expense Dashboard 😎</title>

<style>
/* ✅ Your styles remain unchanged */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f4f9;
  color: #333;
}

/* Header */
.header {
  text-align: center;
  font-size: 28px;
  padding: 25px;
  font-weight: bold;
  background: linear-gradient(90deg, #fe8f4f, #00f2fe);
  color: white;
}

/* Cards */
.summary {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  margin: 20px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin: 10px;
  width: 25%;
  text-align: center;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  transition: 0.3s;
}
.card:hover { transform: scale(1.05); }
label{ font-size: 20px; }

/* Controls */
.controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 20px;
}
input, button {
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
}
button {
  background: green;
  color: white;
  border: none;
  cursor: pointer;
}
button:hover { transform: scale(1.05); }

/* Table */
.table-container {
  width: 95%;
  margin: auto;
  overflow: auto;
  border-radius: 10px;
  background: white;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}
table { width: 100%; border-collapse: collapse; }
th { background-color: #333; color: white; padding: 10px; }
td { padding: 10px; text-align: center; border-bottom: 1px solid #ddd; }
tr:hover { background-color: #f1f1f1; }

/* Badge */
.badge { padding: 5px 10px; border-radius: 8px; background: #eee; font-weight: bold; }

/* Icon */
.icon { font-size: 18px; }

/* Buttons */
.edit { background: orange; border: none; padding: 5px 8px; border-radius: 5px; cursor: pointer; }
.delete { background: red; border: none; padding: 5px 8px; border-radius: 5px; cursor: pointer; }

/* Navbar */
.header { margin: 0; border-radius: 0; }
nav { background-color: #333 !important; padding: 10px !important; text-align: center; }
nav ul { list-style: none; display: inline-flex; gap: 20px !important; padding: 0; }
nav ul li a {
  display: inline-block;
  background-color: #444 !important;
  color: white !important;
  padding: 10px 18px !important;
  border-radius: 6px !important;
  text-decoration: none !important;
  font-weight: bold;
  transition: 0.3s;
}
nav ul li a:hover { background-color: #555 !important; transform: scale(1.05); }
</style>
</head>

<body>
<div class="header">🚀 Ultra Expense Dashboard</div>

<nav>
  <ul>
    <li><a href="homepage.html">Home</a></li>
    <li><a href="budgetplanning.html">Budget Planning</a></li>
    <li><a href="addexpense.html">Add Expense</a></li>
    <li><a href="viewexpense.html">View Expenses</a></li>
    <li><a href="summary.html">Summary</a></li>
    <li><a href="#" onclick="logout()">Logout</a></li>
  </ul>
</nav>

<div class="summary">
  <div class="card">💰 Income ₹<span id="income"></span></div>
  <div class="card">💸 Expense ₹<span id="expense"></span></div>
  <div class="card">⚖️ Balance ₹<span id="balance"></span></div>
</div>

<div class="controls">
  <input type="text" id="search" placeholder="🔍 Search...">
  <label>From:</label>
  <input type="date" id="from">
  <label>To:</label>
  <input type="date" id="to">
  <button onclick="loadData()">Apply</button>
  <button onclick="reset()">Reset</button>
</div>

<div class="table-container">
<table>
<thead>
<tr>
<th>Type</th>
<th>Category</th>
<th>Amount</th>
<th>Date</th>
<th>Time</th>
<th>Action</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<script>
/* CATEGORY ICON */
function getIcon(cat){
  switch(cat){
    case "Food": return "🍔";
    case "Transport": return "🚌";
    case "Rent": return "🏠";
    case "Savings": return "💰";
    case "Entertainment": return "🎮";
    case "Healthcare": return "💊";
    case "Education": return "📚";
    case "Miscellaneous": return "📦";
    case "Salary": return "💼";
    case "Travel": return "✈️";
    default:return "❓";
  }
}

/* GET DATA (user-specific) */
function getData(){
  let currentUser = localStorage.getItem("currentUser") || "guest";
  let transactionsKey = "transactions_" + currentUser;
  return JSON.parse(localStorage.getItem(transactionsKey)) || [];
}

/* COMBINE */
function combineExpenses(data){
  let result = {};
  data.forEach(d => {
    if(!result[d.category]){
      result[d.category] = {
        type: "Expense",
        category: d.category,
        amount: 0,
        date: d.date,
        time: d.time
      };
    }
    result[d.category].amount += Number(d.amount);
    result[d.category].date = d.date;
    result[d.category].time = d.time;
  });
  return Object.values(result);
}

/* LOAD */
function loadData(){
  let currentUser = localStorage.getItem("currentUser") || "guest";
  let expensesKey = "expenses_" + currentUser;

  let data = getData();
  let onlyExpenses = JSON.parse(localStorage.getItem(expensesKey)) || [];
  data = combineExpenses(onlyExpenses);

  let income=50000, expense=0;
  data.forEach(d=>{
    if(d.type==="Income") income+=Number(d.amount);
    else expense+=Number(d.amount);
  });

  document.getElementById("income").innerText=income;
  document.getElementById("expense").innerText=expense;
  document.getElementById("balance").innerText=income-expense;

  let search=document.getElementById("search").value.toLowerCase();
  let from=document.getElementById("from").value;
  let to=document.getElementById("to").value;

  data=data.filter(d=>{
    if(search && !d.category.toLowerCase().includes(search)) return false;
    if(from && d.date<from) return false;
    if(to && d.date>to) return false;
    return true;
  });

  render(data);
}

/* RENDER */
function render(data){
  let table=document.getElementById("table");
  table.innerHTML="";
  let colors=["#ff7675","#74b9ff","#55efc4","#ffeaa7","#a29bfe","#fd79a8","#00cec9","#fab1a0"];

  data.forEach((d,i)=>{
    let tr=document.createElement("tr");
    tr.setAttribute("data-category", d.category);
    tr.style.background=colors[i%colors.length];

    tr.innerHTML=`
      <td>${d.type==="Income"?"💰":"💸"}</td>
      <td><div class="icon">${getIcon(d.category)}</div><span class="badge">${d.category}</span></td>
      <td>₹${d.amount}</td>
      <td>${d.date||"--"}</td>
      <td>${d.time||"--"}</td>
      <td><button class="edit">✏️</button><button class="delete">🗑️</button></td>
    `;
    table.appendChild(tr);

    let category = d.category;
    tr.querySelector(".delete").onclick = () => { deleteCategory(category); };
    tr.querySelector(".edit").onclick = () => { editCategory(category); };
  });
}
/* DELETE CATEGORY (user-specific) */
function deleteCategory(category){
  let currentUser = localStorage.getItem("currentUser") || "guest";
  let expensesKey = "expenses_" + currentUser;

  let expenses = JSON.parse(localStorage.getItem(expensesKey)) || [];
  expenses = expenses.filter(e => e.category !== category);
  localStorage.setItem(expensesKey, JSON.stringify(expenses));
  loadData();
}

/* EDIT CATEGORY (user-specific) */
function editCategory(category){
  let currentUser = localStorage.getItem("currentUser") || "guest";
  let expensesKey = "expenses_" + currentUser;

  let newAmount = prompt("Enter new total amount for " + category);
  if(newAmount === null) return;

  let expenses = JSON.parse(localStorage.getItem(expensesKey)) || [];
  expenses = expenses.filter(e => e.category !== category);

  expenses.push({
    category: category,
    amount: newAmount,
    date: new Date().toISOString().split("T")[0],
    time: "--"
  });

  localStorage.setItem(expensesKey, JSON.stringify(expenses));
  loadData();
}

/* RESET FILTERS */
function reset(){
  document.getElementById("search").value="";
  document.getElementById("from").value="";
  document.getElementById("to").value="";
  loadData();
}

/* INITIAL LOAD */
loadData();

/* LOGOUT */
function logout(){
  localStorage.removeItem("loggedIn");
  localStorage.removeItem("currentUser");
  window.location.href = "login.html";
}
</script>

</body>
</html>
