<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Homepage - Expense Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
    }

    /* Caption Banner */
    .caption {
      background: linear-gradient(90deg, #fe8f4f, #00f2fe, #fe8f4f);
      color: white;
      text-align: center;
      padding: 25px;
      font-size: 1.8em;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    /* Navbar styling */
    nav {
      background-color: #333;
      padding: 15px;
      text-align: center;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: inline-flex;
      gap: 20px;
    }
    nav ul li {
      display: inline;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 6px;
      background-color: #444;
      transition: background-color 0.3s, transform 0.2s;
    }
    nav ul li a:hover {
      background-color: #555;
      transform: scale(1.05);
    }

    /* Image cards section */
    .cards {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 50px auto;
      flex-wrap: wrap;
    }
    .card {
      width: 250px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      text-align: center;
      padding: 15px;
      transition: transform 0.3s;
    }
    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card h3 {
      margin: 10px 0;
      color: #333;
    }

    /* Quick stats section */
    .stats {
      text-align: center;
      margin: 40px auto;
    }
    .stats p {
      font-size: 1.2em;
      color: #444;
      margin: 10px 0;
    }

    /* Footer */
    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <!-- Caption Banner -->
  <div class="caption">
    A New Beginning for Savings
  </div>

  <!-- Navigation Bar -->
  <nav>
    <ul>
      <li><a href="budgetplanning.html">Budget Planning</a></li>
      <li><a href="addexpense.html">Add Expense</a></li>
      <li><a href="viewexpense.html">View Expenses</a></li>
      <li><a href="summary.html">Summary</a></li>
      <li><a href="#" onclick="logout()">Logout</a></li>s
    </ul>
  </nav>

  <!-- Image Cards Section -->
  <div class="cards">
    <div class="card">
      <img src="https://img.freepik.com/premium-photo/floating-dollar-sign-chart-with-budget-planning-text-concept-as-dynamic-vector-featuring-flo_980716-686660.jpg?semt=ais_hybrid&w=740&q=80" alt="Budget Planning">
      <h3>Plan Your Budget</h3>
    </div>
    <div class="card">
      <img src="https://c8.alamy.com/comp/T89GP3/word-writing-text-track-expenses-business-photo-showcasing-keep-a-close-eye-on-how-things-are-tracking-to-budget-hand-holding-megaphone-and-other-two-T89GP3.jpg" alt="Expense Tracking">
      <h3>Track Your Expenses</h3>
    </div>
    <div class="card">
      <img src="https://www.shutterstock.com/image-photo/fund-save-money-business-putting-260nw-2502206275.jpg" alt="Savings">
      <h3>Grow Your Savings</h3>
    </div>
  </div>

  <!-- Quick Stats Section -->
  <div class="stats">
    <p id="totalExpenses">Total Expenses: ₹0</p>
    <p id="categoriesTracked">Categories Tracked: 0</p>
  </div>

  <!-- Footer -->
  <footer>
    "Small savings today, big rewards tomorrow."
  </footer>

  <script>  
  
  function loadSummary() {
      const expensesData = localStorage.getItem("expenses");
      let totalExpenses = 0;
      let categoriesTracked = 0;
      totalExpenses = expenses.reduce((sum, item) => sum + Number(item.amount || 0), 0);
    // Redirect to login if not logged in
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "login.html";
    }

  

      if (expensesData) {
        const expenses = JSON.parse(expensesData);

        totalExpenses = expenses.reduce((sum, item) => sum + (item.amount || 0), 0);

        const categories = new Set(expenses.map(item => item.category));
        categoriesTracked = categories.size;
      }

      document.getElementById("totalExpenses").textContent = "Total Expenses: ₹" + totalExpenses;
      document.getElementById("categoriesTracked").textContent = "Categories Tracked: " + categoriesTracked;
    }

    function logout() {
      localStorage.removeItem("loggedIn");
      localStorage.removeItem("currentUser");
      window.location.href = "login.html";
    }

    window.onload = loadSummary;
  </script>
</body>
</html>
